services:
  issuer_oidc:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-issuer-oidc-py:latest
    ports:
      - "6005:5000"
    volumes:
      # Configuration (see config.yaml for what each setting does).
      - ./config.yaml:/etc/issuer_config/authorization_config.yaml:ro
      - /tmp/oidc_log/:/tmp/oidc_log/
      # Signing, cookie and token keys (generated on first start; keep them
      # across restarts). The host directory must be writable by UID 10001.
      - /etc/eudiw/oidc-keys/:/app/private/
    restart: unless-stopped
