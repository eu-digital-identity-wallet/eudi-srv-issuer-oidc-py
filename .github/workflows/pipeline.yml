# CI/CD image pipeline: builds the Docker image (linux/amd64 + linux/arm64) and
# pushes it to ghcr.io/<owner>/<repo>.
# Runs on push to main and branch-*, on v* tags, and on manual dispatch.
# Needs secrets: GHCR_KEY (token with write:packages for ghcr.io).
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'branch-*'
    tags:
      - 'v[0-9]+.*' 
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_KEY }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # branch-preprod → :branch-preprod, branch-refractoring → :branch-refractoring
            type=ref,event=branch
            # v1.2.3 tag → :1.2.3  and  :1.2  and  :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Multi-arch: build for both amd64 and arm64 in one push.
          # Remove the line below to build for amd64 only (faster CI).
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
