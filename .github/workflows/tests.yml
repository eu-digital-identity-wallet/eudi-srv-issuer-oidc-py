# Unit tests (pytest, Python 3.13) plus Semgrep with the repository's own rules in .semgrep/.
# Runs on every push, pull request and manual dispatch. Needs secrets: none.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token, set per job.
permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Security rules (.semgrep/)
        run: |
          pip install --only-binary :all: semgrep==1.179.0
          semgrep --config .semgrep/ --metrics=off --error --exclude tests .
